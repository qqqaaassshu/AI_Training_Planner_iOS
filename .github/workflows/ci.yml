name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: TrainingCore · Linux
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: Packages/TrainingCore
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift test

  apple:
    name: TrainingCore · Xcode（macOS / iOS / watchOS）
    runs-on: macos-15
    defaults:
      run:
        working-directory: Packages/TrainingCore
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version && swift --version
      - name: 测试（macOS）
        run: swift test
      - name: 编译（iOS 模拟器）
        run: xcodebuild build -scheme TrainingCore -destination 'generic/platform=iOS Simulator' -quiet
      - name: 编译（watchOS 模拟器）
        run: xcodebuild build -scheme TrainingCore -destination 'generic/platform=watchOS Simulator' -quiet

  iphone:
    name: iPhone App（含手表 App，iOS 模拟器）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 选择 iOS 模拟器
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py iOS iPhone)
          echo "使用模拟器 $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: 编译并运行 App 测试
        run: |
          set -o pipefail
          xcodebuild test -project AITrainingPlanner.xcodeproj -scheme AITrainingPlanner \
            -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO -quiet -resultBundlePath AppTests.xcresult
      - name: 测试结果
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path AppTests.xcresult --compact > summary.json
          python3 scripts/xcresult-summary.py summary.json
      - name: 检查手表 App 已嵌入 iPhone App
        run: |
          WATCH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Debug-iphonesimulator/AITrainingPlanner.app/Watch/*.app" -maxdepth 8 -type d | head -1)
          test -n "$WATCH" || { echo "iPhone App 里没有 Watch/ 目录"; exit 1; }
          echo "已嵌入：$WATCH"
          WIDGET=$(find "$WATCH/PlugIns" -name "*.appex" -maxdepth 1 -type d | head -1)
          test -n "$WIDGET" || { echo "手表 App 里没有表盘复杂功能扩展"; exit 1; }
          echo "已嵌入：$WIDGET"

  watch:
    name: Watch App（watchOS 模拟器）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 选择 watchOS 模拟器
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py watchOS "Apple Watch")
          echo "使用模拟器 $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: 编译并运行手表 App 测试
        run: |
          set -o pipefail
          xcodebuild test -project AITrainingPlanner.xcodeproj -scheme AITrainingPlannerWatch \
            -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO -quiet -resultBundlePath WatchTests.xcresult
      - name: 测试结果
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path WatchTests.xcresult --compact > summary.json
          python3 scripts/xcresult-summary.py summary.json

  screenshots:
    name: 界面截图（演示数据）
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 选择模拟器
        run: |
          echo "IOS_UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py iOS iPhone)" >> "$GITHUB_ENV"
          echo "WATCH_UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py watchOS "Apple Watch")" >> "$GITHUB_ENV"
      - name: iPhone 截图
        continue-on-error: true
        run: |
          xcodebuild test -project AITrainingPlanner.xcodeproj -scheme Screenshots \
            -destination "id=$IOS_UDID" CODE_SIGNING_ALLOWED=NO -quiet -resultBundlePath iPhoneShots.xcresult
      - name: 手表截图
        continue-on-error: true
        run: |
          xcodebuild test -project AITrainingPlanner.xcodeproj -scheme WatchScreenshots \
            -destination "id=$WATCH_UDID" CODE_SIGNING_ALLOWED=NO -quiet -resultBundlePath WatchShots.xcresult
      - name: 导出截图
        if: always()
        run: |
          python3 scripts/export-screenshots.py iPhoneShots.xcresult screenshots/iphone
          python3 scripts/export-screenshots.py WatchShots.xcresult screenshots/watch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
      - name: 发布到 screenshots 分支
        if: always() && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/screenshot-index.py screenshots "${GITHUB_SHA::7}"
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "截图（${GITHUB_SHA::7}）"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots

  size:
    name: 安装包大小（Release，真机）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 编译 Release（iPhone 真机，含手表 App）
        run: |
          xcodebuild build -project AITrainingPlanner.xcodeproj -scheme AITrainingPlanner -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
      - name: 统计大小
        run: |
          APP=build/Build/Products/Release-iphoneos/AITrainingPlanner.app
          WATCH=$(ls -d "$APP"/Watch/*.app)
          WIDGET=$(ls -d "$WATCH"/PlugIns/*.appex)
          mkdir -p size/Payload && cp -R "$APP" size/Payload/ && (cd size && zip -qr -9 app.ipa Payload)
          {
            echo "## 安装包大小（Release，未签名）"
            echo ""
            echo "| 部分 | 大小 |"
            echo "|---|---|"
            echo "| iPhone App（含手表 App） | $(du -sh "$APP" | cut -f1) |"
            echo "| 其中手表 App（含表盘） | $(du -sh "$WATCH" | cut -f1) |"
            echo "| 其中表盘复杂功能 | $(du -sh "$WIDGET" | cut -f1) |"
            echo "| 压缩后（下载大小参考） | $(du -sh size/app.ipa | cut -f1) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
