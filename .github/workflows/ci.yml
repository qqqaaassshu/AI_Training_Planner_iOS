name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: TrainingCore · Linux
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: Packages/TrainingCore
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift test

  apple:
    name: TrainingCore · Xcode（macOS / iOS / watchOS）
    runs-on: macos-15
    defaults:
      run:
        working-directory: Packages/TrainingCore
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version && swift --version
      - name: 测试（macOS）
        run: swift test
      - name: 编译（iOS 模拟器）
        run: xcodebuild build -scheme TrainingCore -destination 'generic/platform=iOS Simulator' -quiet
      - name: 编译（watchOS 模拟器）
        run: xcodebuild build -scheme TrainingCore -destination 'generic/platform=watchOS Simulator' -quiet

  iphone:
    name: iPhone App（含手表 App，iOS 模拟器）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 选择 iOS 模拟器
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py iOS iPhone)
          echo "使用模拟器 $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: 编译并运行 App 测试
        run: |
          set -o pipefail
          xcodebuild test -project AITrainingPlanner.xcodeproj -scheme AITrainingPlanner \
            -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO -quiet -resultBundlePath AppTests.xcresult
      - name: 测试结果
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path AppTests.xcresult --compact > summary.json
          python3 scripts/xcresult-summary.py summary.json
      - name: 检查手表 App 已嵌入 iPhone App
        run: |
          WATCH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Debug-iphonesimulator/AITrainingPlanner.app/Watch/*.app" -maxdepth 8 -type d | head -1)
          test -n "$WATCH" || { echo "iPhone App 里没有 Watch/ 目录"; exit 1; }
          echo "已嵌入：$WATCH"
          WIDGET=$(find "$WATCH/PlugIns" -name "*.appex" -maxdepth 1 -type d | head -1)
          test -n "$WIDGET" || { echo "手表 App 里没有表盘复杂功能扩展"; exit 1; }
          echo "已嵌入：$WIDGET"

  watch:
    name: Watch App（watchOS 模拟器）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 选择 watchOS 模拟器
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py watchOS "Apple Watch")
          echo "使用模拟器 $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: 编译并运行手表 App 测试
        run: |
          set -o pipefail
          xcodebuild test -project AITrainingPlanner.xcodeproj -scheme AITrainingPlannerWatch \
            -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO -quiet -resultBundlePath WatchTests.xcresult
      - name: 测试结果
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path WatchTests.xcresult --compact > summary.json
          python3 scripts/xcresult-summary.py summary.json
