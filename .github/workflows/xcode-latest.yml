name: Xcode latest probe

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.runner }} · ${{ matrix.dest }} · FREE=${{ matrix.free }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
        dest: ['generic/platform=iOS', 'generic/platform=iOS Simulator']
        free: ['YES', 'NO']
    env:
      FREE_ACCOUNT: ${{ matrix.free }}
    steps:
      - uses: actions/checkout@v5
      - name: 选择最新 Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          xcodebuild -showsdks
      - run: brew install xcodegen && scripts/generate.sh
      - name: 编译
        run: |
          set -o pipefail
          xcodebuild build -project AITrainingPlanner.xcodeproj -scheme AITrainingPlanner \
            -destination '${{ matrix.dest }}' CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|Swift 6)" | sort -u | head -200
