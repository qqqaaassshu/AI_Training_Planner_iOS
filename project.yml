# Xcode 工程由 XcodeGen 生成：改完本文件后运行 `xcodegen generate`，并提交生成的 AITrainingPlanner.xcodeproj
name: AITrainingPlanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # 在 Xcode 的 Signing & Capabilities 里选择你的开发团队
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  TrainingCore:
    path: Packages/TrainingCore
targets:
  AITrainingPlanner:
    type: application
    platform: iOS
    sources:
      - App/iPhone
    dependencies:
      - package: TrainingCore
    info:
      path: App/iPhone/Info.plist
      properties:
        CFBundleDisplayName: 训练计划
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        # 真机安装前改成你自己的标识，例如 com.你的名字.aitrainingplanner
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aitrainingplanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  AITrainingPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/iPhoneTests
    dependencies:
      - target: AITrainingPlanner
      - package: TrainingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aitrainingplanner.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AITrainingPlanner:
    build:
      targets:
        AITrainingPlanner: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AITrainingPlannerTests
