# Xcode 工程由 XcodeGen 生成：改完本文件后运行 `xcodegen generate`，并提交生成的 AITrainingPlanner.xcodeproj
name: AITrainingPlanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # 在 Xcode 的 Signing & Capabilities 里选择你的开发团队
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  TrainingCore:
    path: Packages/TrainingCore
targets:
  AITrainingPlanner:
    type: application
    platform: iOS
    sources:
      - App/iPhone
    dependencies:
      - package: TrainingCore
      # 手表 App 随 iPhone App 一起安装
      - target: AITrainingPlannerWatch
    info:
      path: App/iPhone/Info.plist
      properties:
        CFBundleDisplayName: 训练计划
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        # 真机安装前改成你自己的标识，例如 com.你的名字.aitrainingplanner
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aitrainingplanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  AITrainingPlannerWatch:
    type: application
    platform: watchOS
    sources:
      - App/Watch
    dependencies:
      - package: TrainingCore
      - sdk: HealthKit.framework
      # 表盘复杂功能随手表 App 一起安装
      - target: AITrainingPlannerWatchWidgets
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: 训练计划
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.aitrainingplanner
        # workout-processing：HKWorkoutSession 训练中后台运行；alarm：智能闹钟会话（强提醒）
        WKBackgroundModes:
          - workout-processing
          - alarm
        NSHealthShareUsageDescription: 读取训练记录，用于在健康 App 中显示体能训练
        NSHealthUpdateUsageDescription: 训练时记录一次体能训练到健康 App，并让手表在训练中保持运行、组间休息结束时震动
    entitlements:
      path: App/Watch/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.com.example.aitrainingplanner
    settings:
      base:
        # 真机安装前改成 <iPhone App 的标识>.watchkitapp
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aitrainingplanner.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        # HealthKit、WatchKit 的回调还没有完整的并发标注，手表 App 先用 Swift 5 语言模式
        SWIFT_VERSION: "5.0"
  AITrainingPlannerWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - App/WatchWidgets
      - App/Watch/Services/WidgetShared.swift
    dependencies:
      - package: TrainingCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: App/WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: 训练计划
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/WatchWidgets/WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.aitrainingplanner
    settings:
      base:
        # 真机安装前改成 <手表 App 的标识>.widgets
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aitrainingplanner.watchkitapp.widgets
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
  AITrainingPlannerWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - App/WatchTests
    dependencies:
      - target: AITrainingPlannerWatch
      - package: TrainingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aitrainingplanner.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
  AITrainingPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/iPhoneUITests
    dependencies:
      - target: AITrainingPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aitrainingplanner.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AITrainingPlanner
  AITrainingPlannerWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - App/WatchUITests
    dependencies:
      - target: AITrainingPlannerWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aitrainingplanner.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AITrainingPlannerWatch
        SWIFT_VERSION: "5.0"
  AITrainingPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/iPhoneTests
    dependencies:
      - target: AITrainingPlanner
      - package: TrainingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aitrainingplanner.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AITrainingPlanner:
    build:
      targets:
        AITrainingPlanner: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AITrainingPlannerTests
  AITrainingPlannerWatch:
    build:
      targets:
        AITrainingPlannerWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AITrainingPlannerWatchTests
  # 界面截图（演示数据），CI 导出为构建产物
  Screenshots:
    build:
      targets:
        AITrainingPlanner: all
    test:
      config: Debug
      targets:
        - AITrainingPlannerUITests
  WatchScreenshots:
    build:
      targets:
        AITrainingPlannerWatch: all
    test:
      config: Debug
      targets:
        - AITrainingPlannerWatchUITests
